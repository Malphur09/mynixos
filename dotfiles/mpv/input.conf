# Open uosc visual menus instead of native text lists
menu        script-binding uosc/menu
]           script-binding uosc/next
[           script-binding uosc/prev
Shift+p     script-binding uosc/playlist
Shift+s     script-binding uosc/subtitles
Shift+a     script-binding uosc/audio
# Use mouse wheel to seek cleanly
WHEEL_UP    seek 5
WHEEL_DOWN  seek -5

