[mgr]
ratio = [1, 3, 4]
sort_by = "natural"
sort_dir_first = true
show_symlink = true
linemode = "size"
scrolloff = 5

[preview]
wrap = "yes"
tab_size = 2
max_width = 1200
max_height = 1200

[[plugin.prepend_fetchers]]
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
url = "*/"
run = "git"
group = "git"

[[plugin.prepend_previewers]]
url = "*.{md,markdown,mdown,mkdn}"
run = "md-glow"

[[plugin.prepend_previewers]]
mime = "text/markdown"
run = "md-glow"

[opener]
image = [{ run = 'imv %s', orphan = true, desc = "Image Viewer" }]
pdf = [{ run = 'zathura %s', orphan = true, desc = "PDF Viewer" }]
media = [{ run = 'mpv %s', orphan = true, desc = "mpv" }]
desktop = [{ run = 'xdg-open %s1', orphan = true, desc = "System default" }]

[open]
prepend_rules = [
  { mime = "image/*", use = ["image", "desktop"] },
  { mime = "application/pdf", use = ["pdf", "desktop"] },
  { mime = "video/*", use = ["media"] },
  { mime = "audio/*", use = ["media"] },
]
