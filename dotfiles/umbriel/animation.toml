[animation]
enabled = true

[animation.workspaces]
curve = "spring:1,1000"

[animation.windows_in]
duration_ms = 200
curve = "easeout"

[animation.windows_out]
duration_ms = 200
curve = "easeout"

[animation.windows_move]
curve = "spring:1,800"

[animation.windows_resize]
curve = "spring:1,1000"

[animation.overview]
curve = "spring:1,900"
workspace_curve = "spring:1,900"
