[[window_rule]]
blur = true
blur_optimized = false

[[window_rule]]
match.app_id = "^dev[.]noctalia[.]Noctalia$"
default_floating = true
default_floating_size_px = { width = 1079, height = 919 }

[[window_rule]]
match.app_id = "^kitty$"
opacity = 0.99

[[window_rule]]
match.app_id = "^kitty$"
match.is_focused = false
opacity = 0.85

[[window_rule]]
match.app_id = "^org[.]gnome[.]Calculator$"
default_floating = true

[[window_rule]]
match.title = "^(Preferences|Settings|About|Properties)$"
default_floating = true
default_floating_size = { width = 0.35, height = 0.45 }

[[window_rule]]
match.app_id = "^firefox$"
match.title = "^Picture-in-Picture$"
default_floating = true

[[window_rule]]
match.app_id = ["^firefox$", "^brave-origin$", "^zed$", "^obsidian$", "^steam$"]
default_maximize = true

[[window_rule]]
match.app_id = "^steam$"
match.title = ".*(Friends|Settings|Properties).*"
default_floating = true

[[window_rule]]
match.app_id = "^steam$"
match.title = "^(?!Steam$).+"
default_floating = true

[[window_rule]]
match.app_id = "^steam$"
match.title = "^notificationtoasts_[0-9]+_desktop$"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false

[[window_rule]]
match.app_id = "^proton-pass$"
default_floating = true
default_floating_size = { width = 0.55, height = 0.65 }

[[window_rule]]
match.app_id = ["^steam_app_[0-9]+$", "^[Ww][Ii][Nn][Ee]", "^[Gg][Oo][Vv][Ee][Rr][Ll][Aa][Yy]", "^retroarch$", "^heroic$"]
default_output = "DP-2"
default_maximize = true

[[window_rule]]
match.app_id = "^mpv$"
default_output = "DP-3"
default_fullscreen = true

[[layer_rule]]
match.namespace = '^noctalia-(bar-[^" ]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^" ]*)$'
blur = true
blur_popups = true
blur_optimized = false
