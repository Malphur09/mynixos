[input.keyboard]
layout = "us,ara"
options = "grp:alt_shift_toggle"
numlock_toggle = true

[input.touchpad]
tap = true
natural_scroll = true

[input.mouse]
accel_profile = "flat"
sensitivity = 0.0

[input.focus]
follows_mouse = true

[input.cursor]
theme = "Bibata-Modern-Classic"
size = 26
hide_when_typing = true
hide_timeout_ms = 5000
