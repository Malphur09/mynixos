[backdrop]
enabled = true

[bar.default]
background_opacity = 0.64
shadow = false
margin_edge = 2
margin_ends = 0
radius = 2
start = ["launcher", "wallpaper", "workspaces"]
center = ["clock", "weather"]
end = ["tray", "notifications", "network", "volume", "battery"]


[control_center.calendar]
show_events_card = false

[lockscreen]
blur_intensity = 0.75
blurred_desktop = true

[notification]
background_opacity = 0.64
layer = "overlay"

[shell]
clipboard_auto_paste = "ctrl_v"
polkit_agent = true
time_format = "%I:%M %p"

[shell.launcher]
categories = false
compact = true

[shell.panel]
transparency_mode = "soft"

[shell.screenshot]
confirm_region = true
skip_annotate_on_copy_save = true

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

[theme.templates]
builtin_ids = ["btop", "gtk3", "gtk4", "kitty", "umbriel"]

[widget.clock]
format = "{:%H:%M %p } "

[widget.network]
show_label = false

[widget.volume]
show_label = false

[widget.weather]
show_condition = false
